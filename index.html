
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAISS Idea Generator</title>

  <style>
    body {
      background: #0b1223;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 80px 20px;
    }

    .card {
      background: #192740;
      padding: 35px;
      border-radius: 16px;
      max-width: 450px;
      margin: auto;
    }

    h1 { color: #80b5ff; }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover { background: #2563eb; }

    #idea { min-height: 70px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>AI Project Idea Generator</h1>
    <p>Need inspiration for your next project?</p>

    <h2 id="idea">Click to get started!</h2>

    <button onclick="generateIdea()">
      Generate Idea
    </button>

    <p>Made by NAISS</p>
  </div>

  <script>
    const ideas = [
      "AI Study Buddy",
      "Smart Campus Navigator",
      "AI Resume Reviewer",
      "Mood-Based Playlist Generator",
      "AI Food Finder"
    ];

    function generateIdea() {
      const random = Math.floor(Math.random() * ideas.length);
      document.getElementById("idea").innerText = ideas[random];
    }
  </script>
</body>
</html>
